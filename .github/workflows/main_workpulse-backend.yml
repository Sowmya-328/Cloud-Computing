name: Deploy Backend to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: workpulse-backend
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_5BC4BBDA50D94014A24A3C183C71C68A }}
          package: ./backend
